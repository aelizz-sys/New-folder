<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>HTML Table</title>
    </head>
    <body>
        <table>
            <!-- TITLE-->
            <caption>Class Roster - Fall 2026</caption>
            <!-- THE TABLE HEADER -->
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Age</th>
                    <th>Major</th>
                    <th>R#</th>
                    <th>Address</th>
                </tr>
            </thead>
            <!-- THE TABLE CONTENT-->
            <tbody>
                <!-- STUDENT ONE -->
                <tr>
                    <td>Alice</td>
                    <td>20</td>
                    <td>Journalism</td>
                </tr>
                <!-- STUDENT TWO -->
                <tr>
                    <td>John</td>
                    <td>21</td>
                    <td>Marketing</td>
                </tr>
                <!-- STUDENT THREE -->
                <tr>
                    <td>Bob</td>
                    <td>22</td>
                    <td>Design</td>
                </tr>
                <!-- STUDENT FOUR -->
                <tr>
                    <td>Mary</td>
                    <td>19</td>
                    <td>Photography</td>
                </tr>
                <!-- STUDENT FIVE -->
                <tr>
                    <td>David</td>
                    <td>23</td>
                    <td>Film</td>
                </tr>
                <!-- STUDENT SIX-->
                <tr>
                    <td>Sarah</td>
                    <td>20</td>
                    <td>Advertising</td>
            </tbody>
        </table>
    </body>
</html>
